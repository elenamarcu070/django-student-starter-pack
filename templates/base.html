{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Django Student Starter Pack</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>

    <body>

        <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
            <div class="container">
                <a class="navbar-brand fw-bold" href="/">
                    Django Student Starter
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <div class="ms-auto d-flex gap-2 mt-3 mt-lg-0">
                        {% if user.is_authenticated %}
                        <a href="/dashboard/"
                            class="btn btn-outline-light btn-sm">Overview</a>
                        <a href="/bookings/"
                            class="btn btn-outline-light btn-sm">Bookings</a>
                        <a href="/accounts/logout/"
                            class="btn btn-light btn-sm">Logout</a>
                        {% else %}
                        <a href="/accounts/login/"
                            class="btn btn-outline-light btn-sm">Login</a>
                        <a href="/accounts/signup/"
                            class="btn btn-light btn-sm">Sign Up</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>

        <main class="container py-4">

            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} app-alert shadow-sm">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            {% block content %}
            {% endblock %}

        </main>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
